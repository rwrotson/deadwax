# PROJECT ----------------------------------------------------------------------
[project]
name = "deadwax"
version = "0.1.0"
description = "Collect what open sources know about a track or album: texts, credits, relations, version identity and listening links"
authors = [
    { name = "Igor Lashkov", email = "rwrotson@yandex.ru" },
]
maintainers = []
keywords = [
    "music",
    "metadata",
    "discography",
    "musicbrainz",
    "discogs",
    "bandcamp",
    "lastfm",
    "wikipedia",
    "odesli",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "pydantic>=2.12.0",
    "selectolax>=1.0.2",
]

[project.urls]
Repository = "https://github.com/rwrotson/deadwax"
Documentation = "https://rwrotson.github.io/deadwax"
Changelog = "https://github.com/rwrotson/deadwax/blob/main/CHANGELOG.md"

[project.scripts]
deadwax = "deadwax.main:main"

[project.optional-dependencies]
logs = [
    "structlog>=26.1.0",
]
cli = [
    "deadwax[logs]",
    "platformdirs>=4.12.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]
stealth = [
    "curl-cffi>=0.17.0",
]
browser = [
    "patchright>=1.64.4",
]
patchright = [
    "patchright>=1.64.4",
]
nodriver = [
    "nodriver>=0.50.99",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "curl-cffi>=0.17.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "nodriver>=0.50.99",
    "patchright>=1.64.4",
    "platformdirs>=4.12.4",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "rich>=15.0.0",
    "ruff>=0.16.10",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.6",
    "properdocs>=1.6.7",
]


# BUILD BACKEND ----------------------------------------------------------------
[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.9",
]

[tool.uv.build-backend]
module-name = "deadwax"
module-root = "src"


# PYTEST -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Sockets are disabled so tests never reach the network; xdist workers talk over Unix sockets.
addopts = "-ra --tb=short --strict-markers --strict-config -n auto --disable-socket --allow-unix-socket"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
source = ["deadwax"]
omit = ["*/__init__.py"]
branch = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95


# MYPY -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "docs", "scripts"]
exclude_gitignore = true
strict = true
disallow_any_unimported = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


# RUFF -------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "ANN",
    "S",
    "RUF",
    "TID",
    # With the formatter's magic trailing comma, wrapped brackets put one item per line.
    "COM812",
    "C4",
    "SIM",
    "PT",
    "RET",
    "ARG",
    "PERF",
    "FURB",
    "PL",
    "DTZ",
    "T20",
    "ERA",
    "BLE",
    "N",
    "PIE",
    "D101",
    "D102",
    "D103",
    "PGH003",
    "PGH004",
    "T100",
    "C901",
    "FBT003",
    "A001",
    "A002",
    "A004",
    "A005",
    "A006",
    "G001",
    "G002",
    "G003",
    "G004",
    "G101",
    "G201",
    "G202",
    "LOG001",
    "LOG002",
    "LOG014",
    "LOG015"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",
    "ARG",
    "S101",
    "S105",
    "S106",
    "D101",
    "D102",
    "D103"
]
"docs/**" = ["T20"]
# Package __init__ files re-export from sibling modules.
"src/**/__init__.py" = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["deadwax"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


# COMMITIZEN -------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true


# IMPORT-LINTER ----------------------------------------------------------------
[tool.importlinter]
root_package = "deadwax"
include_external_packages = true

# Import rules R1-R9 are described in docs/architecture.md.

[[tool.importlinter.contracts]]
name = "R1: package layers"
type = "layers"
layers = ["deadwax.main", "deadwax.cli", "deadwax.logs | deadwax.sources", "deadwax.core"]
# deadwax imports the sources layer only on first use of one of its names (and for type
# checking), so deadwax.logs can take library names from deadwax without loading it.
ignore_imports = ["deadwax -> deadwax.sources", "deadwax -> deadwax.sources.lookup"]

[[tool.importlinter.contracts]]
name = "R5: core modules"
type = "layers"
containers = ["deadwax.core"]
layers = [
    "orchestrator",
    "adapter | merge | markdown",
    "matching", "versions", "normalize", "models", "query", "errors | events"]

[[tool.importlinter.contracts]]
name = "R4: sources modules"
type = "layers"
containers = ["deadwax.sources"]
layers = [
    "lookup",
    "musicbrainz | itunes | deezer | odesli | discogs | bandcamp | lastfm | wikipedia | listenbrainz | secondhandsongs | kexp | spotify | youtube | soundcloud | beatport | hardwax | soundohm | juno | bleep | forcedexposure | phonica | boomkat | norman | genius | allmusic | albumoftheyear | press | residentadvisor",
    "_base | _html",
    "_http",
    "config",
]

[[tool.importlinter.contracts]]
name = "R8: MusicBrainz adapter modules"
type = "layers"
containers = ["deadwax.sources.musicbrainz"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Bandcamp adapter modules"
type = "layers"
containers = ["deadwax.sources.bandcamp"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Discogs adapter modules"
type = "layers"
containers = ["deadwax.sources.discogs"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Last.fm adapter modules"
type = "layers"
containers = ["deadwax.sources.lastfm"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Wikipedia adapter modules"
type = "layers"
containers = ["deadwax.sources.wikipedia"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: ListenBrainz adapter modules"
type = "layers"
containers = ["deadwax.sources.listenbrainz"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: SecondHandSongs adapter modules"
type = "layers"
containers = ["deadwax.sources.secondhandsongs"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: KEXP adapter modules"
type = "layers"
containers = ["deadwax.sources.kexp"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Spotify adapter modules"
type = "layers"
containers = ["deadwax.sources.spotify"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: SoundCloud adapter modules"
type = "layers"
containers = ["deadwax.sources.soundcloud"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Beatport adapter modules"
type = "layers"
containers = ["deadwax.sources.beatport"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Hard Wax adapter modules"
type = "layers"
containers = ["deadwax.sources.hardwax"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Soundohm adapter modules"
type = "layers"
containers = ["deadwax.sources.soundohm"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: Juno adapter modules"
type = "layers"
containers = ["deadwax.sources.juno"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: Phonica adapter modules"
type = "layers"
containers = ["deadwax.sources.phonica"]
layers = ["adapter", "parse", "models"]

[[tool.importlinter.contracts]]
name = "R8: Boomkat adapter modules"
type = "layers"
containers = ["deadwax.sources.boomkat"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: Norman Records adapter modules"
type = "layers"
containers = ["deadwax.sources.norman"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: Bleep adapter modules"
type = "layers"
containers = ["deadwax.sources.bleep"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: Forced Exposure adapter modules"
type = "layers"
containers = ["deadwax.sources.forcedexposure"]
layers = ["adapter", "parse"]

[[tool.importlinter.contracts]]
name = "R8: HTTP stack modules"
type = "layers"
containers = ["deadwax.sources._http"]
layers = [
    "client",
    "impersonate | browser | nodriver | plain | cache",
    "challenge | profiles | ratelimit | retry | messages",
]

[[tool.importlinter.contracts]]
name = "R3: applications use the library only through the deadwax public API"
type = "forbidden"
source_modules = ["deadwax.main", "deadwax.cli", "deadwax.logs"]
forbidden_modules = ["deadwax.core", "deadwax.sources"]
# The deadwax package itself re-exports the core and sources.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R3: sources use the core only through the deadwax.core package"
type = "forbidden"
source_modules = ["deadwax.sources"]
forbidden_modules = ["deadwax.core.*"]
# deadwax.core re-exports its modules.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R6: the core uses only Pydantic among third-party packages"
type = "forbidden"
source_modules = ["deadwax.core"]
forbidden_modules = [
    "httpx",
    "selectolax",
    "curl_cffi",
    "patchright",
    "nodriver",
    "structlog",
    "pydantic_settings",
    "platformdirs",
    "typer",
    "rich",
]

[[tool.importlinter.contracts]]
name = "R6: sources do not use logging setup or CLI packages"
type = "forbidden"
source_modules = ["deadwax.sources"]
forbidden_modules = ["structlog", "pydantic_settings", "platformdirs", "typer", "rich"]

[[tool.importlinter.contracts]]
name = "R6: logging setup does not use HTTP, settings loading or CLI packages"
type = "forbidden"
source_modules = ["deadwax.logs"]
# The deferred import of the sources layer by deadwax, as in R1.
ignore_imports = ["deadwax -> deadwax.sources", "deadwax -> deadwax.sources.lookup"]
forbidden_modules = [
    "httpx",
    "selectolax",
    "curl_cffi",
    "patchright",
    "nodriver",
    "pydantic_settings",
    "platformdirs",
    "typer",
    "rich",
]

[[tool.importlinter.contracts]]
name = "R6: HTTP and HTML packages are used only by sources"
type = "forbidden"
source_modules = ["deadwax.main", "deadwax.cli"]
forbidden_modules = ["httpx", "selectolax", "curl_cffi", "patchright", "nodriver"]
# The CLI reaches them through the deadwax package.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R6: curl_cffi is used only by the impersonation transport"
type = "forbidden"
source_modules = ["deadwax"]
forbidden_modules = ["curl_cffi"]
ignore_imports = ["deadwax.sources._http.impersonate -> curl_cffi"]

[[tool.importlinter.contracts]]
name = "R6: Patchright is used only by the browser transport"
type = "forbidden"
source_modules = ["deadwax"]
forbidden_modules = ["patchright"]
ignore_imports = ["deadwax.sources._http.browser -> patchright"]

[[tool.importlinter.contracts]]
name = "R6: Nodriver is used only by its transport"
type = "forbidden"
source_modules = ["deadwax"]
forbidden_modules = ["nodriver"]
ignore_imports = ["deadwax.sources._http.nodriver -> nodriver"]

[[tool.importlinter.contracts]]
name = "R6: transitive dependencies are not imported directly"
type = "forbidden"
source_modules = ["deadwax"]
forbidden_modules = [
    "anyio",
    "certifi",
    "click",
    "greenlet",
    "h11",
    "h2",
    "httpcore",
    "idna",
    "markdown_it",
    "pygments",
    "shellingham",
    "sniffio",
    "typing_extensions",
]
# Direct dependencies import them internally.
allow_indirect_imports = true


# POETHEPOET -------------------------------------------------------------------
[tool.poe.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-imports = "lint-imports"
typecheck = "mypy"
test = "pytest --cov"
test-fast = "pytest"
docs = "properdocs serve"
check = ["fmt-check", "lint", "lint-imports", "typecheck", "test"]

# Live lookups of tests/integration, one at a time to respect the sources' rate limits;
# credentials come from .env when it exists.
[tool.poe.tasks.test-live]
cmd = "pytest tests/integration --live -n 0 -p no:randomly"
envfile = { optional = [".env"] }

[tool.poe.tasks.audit]
shell = """
uv export --quiet --format requirements-txt --all-groups --locked --no-emit-project --no-hashes --output-file requirements-audit.txt
uv run --locked --with pip-audit pip-audit --requirement requirements-audit.txt --no-deps
"""
